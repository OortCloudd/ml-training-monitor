[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-training-monitor"
version = "0.1.0"
description = "Training monitoring with optional integrated performance collection"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ml-training-monitor = "mlmonitor.server:main"
ml-monitor-profiles = "mlmonitor.worker:main"

[tool.setuptools]
packages = ["mlmonitor"]

[tool.setuptools.package-data]
mlmonitor = ["index.html"]
